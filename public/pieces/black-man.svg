<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="blackGrad" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#4d545c"/>
      <stop offset="52%" stop-color="#262b31"/>
      <stop offset="100%" stop-color="#0c0e11"/>
    </radialGradient>
    <filter id="blackShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="42" fill="url(#blackGrad)" filter="url(#blackShadow)"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(235,255,250,0.34)" stroke-width="4"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="12"/>
</svg>
