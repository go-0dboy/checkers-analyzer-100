<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="blackKingGrad" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#4d545c"/>
      <stop offset="52%" stop-color="#262b31"/>
      <stop offset="100%" stop-color="#0c0e11"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6d489"/>
      <stop offset="100%" stop-color="#dfa03c"/>
    </linearGradient>
    <filter id="blackKingShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
