    </filter>
  </defs>
  <circle cx="50" cy="50" r="42" fill="url(#blackKingGrad)" filter="url(#blackKingShadow)"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(235,255,250,0.34)" stroke-width="4"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="12"/>
  <g filter="url(#crownShadow)">
