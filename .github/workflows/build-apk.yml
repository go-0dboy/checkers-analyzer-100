# ============================================================
# Нативная сборка Android-APK из git.
#
# Триггеры:
#   - пуш в main/master  → debug-APK (артефакт прогона)
#   - тег v*             → debug + release (подпись из секретов)
#                          и прикрепление к GitHub Release
#   - workflow_dispatch  → ручной запуск
#
# Требования: Node >= 22 (setup-node, .nvmrc) и JDK 21 (Capacitor 7).
# ============================================================

name: Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Сборка APK · Node 22
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Чекаут репозитория
        uses: actions/checkout@v4

      - name: Node.js 22 (обязательное требование)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Веб-сборка (dist/)
        run: npm run build

      # Папку android/ можно коммитить, а можно генерировать в CI —
      # workflow корректно работает в обоих случаях.
      - name: Capacitor · платформа Android
        run: |
          if [ ! -d android ]; then
            echo "::notice::android/ отсутствует — создаю шаблон (npx cap add android)"
            npx cap add android
          fi
          npx cap sync android

      # Фирменная иконка: assets/app-icon.svg → PNG всех плотностей
      # (ImageMagick с RSVG предуставлен на ubuntu-раннерах).
      - name: "Фирменные иконки приложения"
        run: |
          ICON=assets/app-icon.svg
          RES=android/app/src/main/res
          if [ -f "$ICON" ]; then
            convert -background none "$ICON" -resize 48x48    "$RES/mipmap-mdpi/ic_launcher.png"
            convert -background none "$ICON" -resize 72x72    "$RES/mipmap-hdpi/ic_launcher.png"
            convert -background none "$ICON" -resize 96x96    "$RES/mipmap-xhdpi/ic_launcher.png"
            convert -background none "$ICON" -resize 144x144  "$RES/mipmap-xxhdpi/ic_launcher.png"
            convert -background none "$ICON" -resize 192x192  "$RES/mipmap-xxxhdpi/ic_launcher.png"
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"
            done
            # адаптивная иконка (API 26+): фон-цвет + наш PNG-foreground
            rm -f "$RES/drawable/ic_launcher_foreground.xml"
            mkdir -p "$RES/drawable-xxxhdpi"
            convert -background none "$ICON" -resize 432x432 "$RES/drawable-xxxhdpi/ic_launcher_fg.png"
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
              '  <background android:drawable="@color/ic_launcher_background"/>' \
              '  <foreground android:drawable="@drawable/ic_launcher_fg"/>' \
              '</adaptive-icon>' > "$RES/mipmap-anydpi-v26/ic_launcher.xml"
            cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<resources>' \
              '  <color name="ic_launcher_background">#0B1416</color>' \
              '</resources>' > "$RES/values/ic_launcher_background.xml"
            echo "::notice::Фирменные иконки установлены"
          else
            echo "::warning::assets/app-icon.svg не найден — остаются стандартные иконки"
          fi

      # Capacitor 7 требует JDK 21 (source/target compatibility 21),
      # с JDK 17 падает «invalid source release: 21».
      - name: JDK 21 (Temurin) — обязательное требование Capacitor 7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Дистрибутив -bin достаточно для CI и качается быстрее, чем -all (~150 МБ).
      - name: "Оптимизация: Gradle-дистрибутив -bin"
        run: |
          sed -i 's/-all\.zip/-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Кэш Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка debug-APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # Release собирается и подписывается, только если заданы секреты.
      - name: Сборка release-APK (подпись из секретов)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/ci-release.keystore
          cd android
          KEYSTORE_FILE="$PWD/app/ci-release.keystore" \
            ./gradlew --no-daemon \
              -I ../.github/ci/signing.init.gradle \
              assembleRelease

      - name: Публикация артефактов
        uses: actions/upload-artifact@v4
        with:
          name: stokeletka-apk-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk

      # Для тегов v* APK попадают прямо в GitHub Release.
      - name: Прикрепить APK к GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
